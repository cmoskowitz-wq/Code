[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "jacob"
version = "0.1.0"
description = "A Python project"
requires-python = ">=3.10"

[project.scripts]
jacob = "jacob.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
