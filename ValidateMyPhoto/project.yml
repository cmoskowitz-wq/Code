name: ValidateMyPhoto

options:
  bundleIdPrefix: com.moskophotolabs
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

targets:
  ValidateMyPhoto:
    type: application
    platform: macOS
    deploymentTarget: "13.0"

    sources:
      - path: ValidateMyPhoto
        excludes:
          - "**/.DS_Store"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moskophotolabs.ValidateMyPhoto
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: ValidateMyPhoto/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ValidateMyPhoto/Resources/ValidateMyPhoto.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        # Universal binary
        ARCHS: "$(ARCHS_STANDARD)"
        # Optimization
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        GCC_OPTIMIZATION_LEVEL: "s"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          ENABLE_TESTABILITY: NO

    dependencies:
      - sdk: CoreML.framework
      - sdk: Vision.framework
      - sdk: Accelerate.framework
      - sdk: ImageIO.framework
      - sdk: AppKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: CoreImage.framework
      - sdk: CoreGraphics.framework

schemes:
  ValidateMyPhoto:
    build:
      targets:
        ValidateMyPhoto: all
    run:
      config: Debug
    archive:
      config: Release
